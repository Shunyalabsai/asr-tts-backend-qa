name: 3-Hourly Smoke Tests
on:
  schedule: [{ cron: '30 */3 * * *' }]  # Every 3 hours
  workflow_dispatch:                     # Manual trigger

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { lfs: true }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm ci
      - run: npx playwright install chromium
      - name: Health check
        run: npx playwright test src/features/health-check/
        env:
          ASR_BASE_URL: ${{ secrets.ASR_BASE_URL }}
      - name: Auth check
        run: npx playwright test src/features/authentication/
        env:
          ASR_BASE_URL: ${{ secrets.ASR_BASE_URL }}
          ASR_API_KEY: ${{ secrets.ASR_API_KEY }}
      - name: Batch smoke
        run: npx playwright test --grep '@smoke'
        env:
          ASR_BASE_URL: ${{ secrets.ASR_BASE_URL }}
          ASR_API_KEY: ${{ secrets.ASR_API_KEY }}
