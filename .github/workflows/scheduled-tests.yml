name: Daily ASR Test Suite
on:
  schedule: [{ cron: '30 3 * * 1-5' }]  # Weekdays 9:00 AM IST
  workflow_dispatch:                       # Manual trigger

jobs:
  full-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with: { lfs: true }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm ci
      - run: npx playwright install chromium
      - name: Run full test suite
        run: bash scripts/run-all-tests.sh
        env:
          ASR_BASE_URL: ${{ secrets.ASR_BASE_URL }}
          ASR_API_KEY: ${{ secrets.ASR_API_KEY }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      - name: Generate reports
        run: npm run report
      - name: Send email report
        run: npm run report:email
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          REPORT_EMAIL_TO: ${{ secrets.REPORT_EMAIL_TO }}
          REPORT_EMAIL_FROM: ${{ secrets.REPORT_EMAIL_FROM }}
      - uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: reports/
          retention-days: 30
