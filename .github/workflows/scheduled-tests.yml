name: Daily ASR Test Suite + Deploy
on:
  schedule: [{ cron: '30 3 * * 1-5' }]  # Weekdays 9:00 AM IST
  workflow_dispatch:                       # Manual trigger

jobs:
  full-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write                     # To push to gh-pages branch
      pages: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with: { lfs: true }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm ci
      - run: npx playwright install chromium
      - run: npx playwright install-deps chromium

      # Run all tests + generate reports + save run history + push to Google Sheets
      - name: Run tests & generate reports
        run: npm run report
        env:
          ASR_BASE_URL: ${{ secrets.ASR_BASE_URL }}
          ASR_API_KEY: ${{ secrets.ASR_API_KEY }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}

      # Run language accuracy tests from Google Sheets input → CSV + Google Sheets output
      - name: Run language accuracy tests
        run: npm run accuracy
        env:
          ASR_BASE_URL: ${{ secrets.ASR_BASE_URL }}
          ASR_API_KEY: ${{ secrets.ASR_API_KEY }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SHEET_ID_INDIC_INPUT: ${{ secrets.GOOGLE_SHEET_ID_INDIC_INPUT }}
          GOOGLE_SHEET_ID_CODESWITCH_INPUT: ${{ secrets.GOOGLE_SHEET_ID_CODESWITCH_INPUT }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}

      - name: Send email report
        run: npm run report:email
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          REPORT_EMAIL_TO: ${{ secrets.REPORT_EMAIL_TO }}
          REPORT_EMAIL_FROM: ${{ secrets.REPORT_EMAIL_FROM }}

      # Deploy to GitHub Pages so dashboard auto-updates
      - name: Prepare deployment assets
        run: npx ts-node scripts/prepare-dashboard.ts
        continue-on-error: true

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy
          publish_branch: gh-pages
          keep_files: true
          user_name: 'asr-test-bot'
          user_email: 'bot@unitedwecare.com'

      - uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: reports/
          retention-days: 30
