name: Scheduled STT & TTS Automated Test Suite

on:
  schedule:
    - cron: '30 22 * * *' # 4:00 AM IST
    - cron: '30 11 * * *' # 5:00 PM IST
  repository_dispatch:
    types: [scheduled_daily_run, scheduled_test_run]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers & OS Dependencies
        run: npx playwright install --with-deps

      - name: Write .env from secrets
        run: |
          cat > .env <<EOF
          ASR_API_KEY=${{ secrets.ASR_API_KEY || secrets.SHUNYA_API_KEY }}
          SHUNYA_API_KEY=${{ secrets.SHUNYA_API_KEY || secrets.ASR_API_KEY }}
          ASR_BASE_URL=${{ secrets.ASR_BASE_URL || 'https://asrv2prod.shunyalabs.ai' }}
          SMTP_HOST=${{ secrets.SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_PORT=${{ secrets.SMTP_PORT || '587' }}
          SMTP_USER=${{ secrets.SMTP_USER }}
          SMTP_PASS=${{ secrets.SMTP_PASS }}
          REPORT_EMAIL_FROM=${{ secrets.REPORT_EMAIL_FROM || 'yamini@shunyalabs.ai' }}
          REPORT_EMAIL_TO=${{ secrets.REPORT_EMAIL_TO || 'yamini@shunyalabs.ai' }}
          REPORT_BASE_URL=https://shunyalabsai.github.io/asr-tts-backend-qa/
          GOOGLE_SHEET_ID=${{ secrets.GOOGLE_SHEET_ID || '1yJPbtXwuKlXLkZtA4r_v5xLPCv2S8zRtf9aJZ-yFS-o' }}
          GOOGLE_SHEET_ID_INDIC_INPUT=${{ secrets.GOOGLE_SHEET_ID_INDIC_INPUT || '1hWphhqgyjlgQD39TtnlkpHasDm0Vks1ZmfGYWNicN9c' }}
          GOOGLE_SERVICE_ACCOUNT_JSON=${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_B64 || secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          EOF

      - name: Run Complete Test Suite
        run: |
          npm test || true

      - name: Build & Compile Live Dashboard Assets
        run: |
          npm run dashboard:prepare

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy
          publish_branch: gh-pages
          force_orphan: false

      - name: Clean up sensitive files
        if: always()
        run: |
          rm -f .env
