name: Deploy Dashboard to GitHub Pages
on:
  workflow_dispatch:                       # Manual trigger only

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write                     # To push to gh-pages branch
      pages: write                        # To deploy to GitHub Pages
      id-token: write                     # For OIDC

    steps:
      - uses: actions/checkout@v4
        with: { lfs: true }

      - uses: actions/setup-node@v4
        with: { node-version: '22' }

      - run: npm ci
      - run: npx playwright install chromium
      - run: npx playwright install-deps chromium

      # Step 1: Run ALL tests module-by-module + generate reports + push to Google Sheets + save run history
      - name: Run tests & generate reports
        run: npm run report
        env:
          ASR_BASE_URL: ${{ secrets.ASR_BASE_URL }}
          ASR_API_KEY: ${{ secrets.ASR_API_KEY }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}

      # Step 1b: Run language accuracy tests
      - name: Run language accuracy tests
        run: npm run accuracy
        env:
          ASR_BASE_URL: ${{ secrets.ASR_BASE_URL }}
          ASR_API_KEY: ${{ secrets.ASR_API_KEY }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SHEET_ID_INDIC_INPUT: ${{ secrets.GOOGLE_SHEET_ID_INDIC_INPUT }}
          GOOGLE_SHEET_ID_CODESWITCH_INPUT: ${{ secrets.GOOGLE_SHEET_ID_CODESWITCH_INPUT }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}

      # Step 2: Run prepare-dashboard to copy report + verify runs/
      - name: Prepare deployment assets
        run: npx ts-node scripts/prepare-dashboard.ts
        continue-on-error: true

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy
          publish_branch: gh-pages
          keep_files: true                # Don't wipe old runs
          user_name: 'asr-test-bot'
          user_email: 'bot@unitedwecare.com'
