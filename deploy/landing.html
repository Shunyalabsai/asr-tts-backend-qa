<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ASR Test Dashboard</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .card {
      background: #1e293b;
      border-radius: 1rem;
      padding: 3rem;
      border: 1px solid #334155;
      max-width: 600px;
      width: 100%;
      text-align: center;
    }
    h1 {
      font-size: 1.8rem;
      margin-bottom: 0.5rem;
      color: #f8fafc;
    }
    p {
      color: #94a3b8;
      margin-bottom: 2rem;
      line-height: 1.6;
    }
    .btn {
      display: inline-block;
      padding: 0.75rem 2rem;
      background: #3b82f6;
      color: white;
      text-decoration: none;
      border-radius: 0.5rem;
      font-weight: 600;
      font-size: 1rem;
      transition: background 0.2s;
    }
    .btn:hover { background: #2563eb; }
    .reports {
      margin-top: 2rem;
      text-align: left;
    }
    .reports h3 {
      color: #64748b;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.75rem;
    }
    .reports a {
      display: block;
      color: #60a5fa;
      text-decoration: none;
      padding: 0.4rem 0;
      font-size: 0.9rem;
      border-bottom: 1px solid #1e293b;
    }
    .reports a:hover { color: #93c5fd; }
    .status {
      display: inline-block;
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 600;
      margin-bottom: 1.5rem;
    }
    .status.active { background: #065f46; color: #22c55e; }
  </style>
</head>
<body>
  <div class="card">
    <div class="status active">● LIVE</div>
    <h1>ASR Test Dashboard</h1>
    <p>Automated test results for the Shunyalabs Speech-to-Text API v2.<br>
    Reports are generated after each test run.</p>
    <a href="./index.html" class="btn">View Latest Report</a>
    <div class="reports">
      <h3>Recent Reports</h3>
      <a href="./ASR-Test-Report-2026-07-27.html">2026-07-27</a>
      
    </div>
  </div>
</body>
</html>
