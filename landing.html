<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ASR API v2 Dashboard</title>
  <style>
    :root {
      --bg: #05091A;
      --bg-card: #0B162A;
      --bg-card2: #0F1E38;
      --border: #1A3050;
      --text: #E2ECF8;
      --text-muted: #6A8CAE;
      --cyan: #00D4FF;
      --purple: #7C3AED;
      --green: #10B981;
      --grad: linear-gradient(135deg, #00D4FF 0%, #7C3AED 100%);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .header {
      background: linear-gradient(135deg, #05091A 0%, #0D1B38 40%, #120840 100%);
      border-bottom: 1px solid var(--border);
      padding: 2rem;
      text-align: center;
    }
    .header h1 {
      font-size: 1.6rem;
      font-weight: 700;
      background: var(--grad);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 0.5rem;
    }
    .header p { color: var(--text-muted); font-size: 0.9rem; }
    .container { flex: 1; max-width: 700px; margin: 0 auto; padding: 2rem; width: 100%; }
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      padding: 1.5rem;
      margin-bottom: 1rem;
      transition: all 0.2s;
      cursor: pointer;
    }
    .card:hover { border-color: var(--cyan); background: var(--bg-card2); transform: translateY(-1px); }
    .card a {
      text-decoration: none;
      color: inherit;
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .card .icon { font-size: 2rem; width: 3rem; text-align: center; }
    .card .title { font-weight: 600; font-size: 1.05rem; margin-bottom: 0.2rem; }
    .card .desc { color: var(--text-muted); font-size: 0.8rem; }
    .card .arrow { margin-left: auto; color: var(--text-muted); font-size: 1.25rem; }
    .badge {
      display: inline-block;
      background: var(--bg-card2);
      border: 1px solid var(--border);
      border-radius: 9999px;
      padding: 0.2rem 0.75rem;
      font-size: 0.7rem;
      color: var(--text-muted);
      white-space: nowrap;
    }
    .footer {
      text-align: center;
      padding: 1.5rem;
      color: var(--text-muted);
      font-size: 0.75rem;
      border-top: 1px solid var(--border);
    }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; margin-top: 2rem; }
    .grid .card { margin-bottom: 0; }
    .grid .card .icon { font-size: 1.5rem; }
    .status-dot {
      display: inline-block;
      width: 8px; height: 8px;
      border-radius: 50%;
      margin-right: 0.4rem;
    }
    .status-dot.green { background: var(--green); }
    .status-dot.yellow { background: #F59E0B; }
    .status-dot.cyan { background: var(--cyan); }

    @media (max-width: 600px) {
      .grid { grid-template-columns: 1fr; }
      .header { padding: 1.25rem; }
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>🎤 ASR API v2 Dashboard</h1>
    <p>Automated testing · Shunyalabs Speech-to-Text API</p>
  </div>
  <div class="container">

    <!-- Main dashboard entry -->
    <div class="card" onclick="location.href='dashboard-v2.html'">
      <a href="dashboard-v2.html">
        <div class="icon">📊</div>
        <div>
          <div class="title">v2 Dashboard</div>
          <div class="desc">KPI cards, per-module breakdown, run history, all failures</div>
        </div>
        <div class="arrow">→</div>
      </a>
    </div>

    <!-- Secondary links -->
    <div class="grid">
      <div class="card" onclick="location.href='dashboard-v2.html#tab-runs'">
        <a href="dashboard-v2.html#tab-runs">
          <div class="icon">🗂️</div>
          <div>
            <div class="title">Run History</div>
            <div class="desc">
              <span class="status-dot green" id="runDot"></span>
              <span id="runCount">Loading...</span>
            </div>
          </div>
        </a>
      </div>
      <div class="card" onclick="location.href='dashboard-v2.html#tab-failures'">
        <a href="dashboard-v2.html#tab-failures">
          <div class="icon">⚠️</div>
          <div>
            <div class="title">Failures</div>
            <div class="desc">
              <span class="status-dot yellow" id="failDot"></span>
              <span id="failCount">Loading...</span>
            </div>
          </div>
        </a>
      </div>
    </div>

    <!-- Old dashboard (legacy) -->
    <div class="card" onclick="location.href='index_old.html'" style="opacity:0.6;">
      <a href="index_old.html">
        <div class="icon">🔙</div>
        <div>
          <div class="title">Legacy Dashboard</div>
          <div class="desc">Original Shunyalabs ASR QC Dashboard (v1 data)</div>
        </div>
        <div class="arrow">↗</div>
      </a>
    </div>

  </div>
  <div class="footer">
    <span id="statusLine">● Loading...</span>
  </div>

  <script>
    fetch('runs/index.json')
      .then(r => r.json())
      .then(idx => {
        const runs = idx.runs || [];
        document.getElementById('runCount').textContent = runs.length + ' runs';
        document.getElementById('runDot').className = 'status-dot ' + (runs.length > 0 ? 'green' : 'yellow');

        // Count total failures across all runs
        let totalFail = 0;
        Promise.all(runs.map(fn =>
          fetch('runs/' + fn).then(r => r.json()).then(d => {
            totalFail += d.failures ? d.failures.length : 0;
          }).catch(() => {})
        )).then(() => {
          document.getElementById('failCount').textContent = totalFail + ' failures';
          document.getElementById('failDot').className = 'status-dot ' + (totalFail > 0 ? 'yellow' : 'green');
          document.getElementById('statusLine').textContent =
            '● ' + runs.length + ' runs · ' + totalFail + ' total failures · ' + new Date().toISOString().split('T')[0];
        });
      })
      .catch(() => {
        document.getElementById('runCount').textContent = 'No runs yet';
        document.getElementById('statusLine').textContent = '● No data — run tests first';
      });
  </script>
</body>
</html>
